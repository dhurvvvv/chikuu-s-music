rent-password" placeholder="••••••••"></label><button type="submit" id="signin-submit" class="primary">Sign In</button></form><form id="form-signup" class="auth-form" hidden novalidate><label for="signup-email">Email address<input type="email" id="signup-email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label for="signup-password">Password<input type="password" id="signup-password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button type="submit" id="signup-submit" class="primary">Create Account</button></form><p id="login-status" class="login-status" role="status" aria-live="polite"></p><small class="login-footer-tag">CHIKU'S PLAY · AUTHENTICATION GATE</small></main><script type="module" src="js/login.js?v=auth-1"></script></body></html>
